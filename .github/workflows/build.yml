name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strings:
    name: Strings up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check generated L10n files match strings.json
        run: python3 shared/localization/generate.py --check

  macos:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Ad-hoc signed and without hardened runtime, so CI needs no certificates
      # and the test bundle can load into the app.
      - name: Build and test
        run: |
          xcodebuild test \
            -project PRChecker.xcodeproj \
            -scheme PRChecker \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Test core
        run: dotnet test --project tests/PRChecker.Core.Tests --configuration Release

      # Self-contained, unsigned builds that run from a folder; for trying the app
      # (e.g. in a VM) until Velopack releases are published.
      - name: Publish app
        run: |
          dotnet publish src/PRChecker.App -c Release -r win-arm64 -o artifacts/PRChecker-win-arm64
          dotnet publish src/PRChecker.App -c Release -r win-x64 -o artifacts/PRChecker-win-x64

      # The app crashes at startup without its own PRI (compiled XAML resources).
      - name: Check app resources
        shell: pwsh
        run: |
          foreach ($dir in "artifacts/PRChecker-win-arm64", "artifacts/PRChecker-win-x64") {
            $pri = Get-ChildItem $dir -Filter *.pri | Where-Object { $_.Name -in "PRChecker.pri", "resources.pri" }
            if (-not $pri) { Get-ChildItem $dir -Filter *.pri | Format-Table Name; throw "No app PRI in $dir" }
            if (-not (Test-Path "$dir/THIRD-PARTY-NOTICES.txt")) { throw "No license notices in $dir" }
            Write-Host "$dir has $($pri.Name)"
          }

      - uses: actions/upload-artifact@v5
        with:
          name: PRChecker-win-arm64
          path: windows/artifacts/PRChecker-win-arm64
          retention-days: 14

      - uses: actions/upload-artifact@v5
        with:
          name: PRChecker-win-x64
          path: windows/artifacts/PRChecker-win-x64
          retention-days: 14
